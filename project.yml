name: SiTVATV
options:
  bundleIdPrefix: com.solyan
  deploymentTarget:
    tvOS: "17.0"
packages:
  CMAFKit:
    url: https://github.com/atelier-socle/swift-cmaf-kit.git
    exactVersion: 0.1.2
  VLCKit:
    url: https://github.com/videolan/vlckit.git
    revision: 2e0868f5ed40fe59cd92f377645fdcc260c6e759
settings:
  base:
    SWIFT_VERSION: 5.10
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  SiTVATV:
    type: application
    platform: tvOS
    sources:
      - path: SiTVATV
    dependencies:
      - package: CMAFKit
        product: CMAFKit
      - package: CMAFKit
        product: CMAFKitDRM
      - package: VLCKit
        product: VLCKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.solyan.sitvatv
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SiTV
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - SiTVATVTests
  SiTVATVTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: SiTVATVTests
    dependencies:
      - target: SiTVATV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.solyan.sitvatv.tests
        GENERATE_INFOPLIST_FILE: YES
