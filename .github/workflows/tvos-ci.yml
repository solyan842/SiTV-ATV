name: tvOS CI

on:
  push:
    branches:
      - main
      - dev/**
    paths-ignore:
      - README.md
      - AGENTS.md
      - docs/**
  pull_request:
    paths-ignore:
      - README.md
      - AGENTS.md
      - docs/**

concurrency:
  group: tvos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          LOG_FILE="ci-logs/tvos-build-test.log"
          DESTINATION=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data.get("devices", {}).items():
              if "tvOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("Apple TV"):
                      print(device.get("udid", ""))
                      raise SystemExit
          ')
          if [ -z "$DESTINATION" ]; then
            echo "No available Apple TV simulator found" | tee -a "$LOG_FILE"
            exit 1
          fi
          echo "Using tvOS simulator: $DESTINATION" | tee -a "$LOG_FILE"
          xcodebuild \
            -project SiTVATV.xcodeproj \
            -scheme SiTVATV \
            -destination "platform=tvOS Simulator,id=$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee -a "$LOG_FILE"
          exit ${PIPESTATUS[0]}

      - name: Upload durable build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tvos-build-test-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs/tvos-build-test.log
          if-no-files-found: warn
          retention-days: 14
