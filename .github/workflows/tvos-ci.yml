name: tvOS CI

on:
  push:
    branches:
      - main
      - dev/**
  pull_request:

jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available tvOS simulators
        run: xcrun simctl list devices available | grep -i "Apple TV" || true

      - name: Build and test
        run: |
          set -o pipefail
          DESTINATION=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data.get("devices", {}).items():
              if "tvOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("Apple TV"):
                      print(device.get("udid", ""))
                      raise SystemExit
          ')
          if [ -z "$DESTINATION" ]; then
            echo "No available Apple TV simulator found"
            exit 1
          fi
          echo "Using tvOS simulator: $DESTINATION"
          xcodebuild \
            -project SiTVATV.xcodeproj \
            -scheme SiTVATV \
            -destination "platform=tvOS Simulator,id=$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO \
            test
